name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            rust_targets: x86_64-pc-windows-msvc
            build_args: "--win nsis portable"
          - os: macos-latest
            platform: darwin
            arch: arm64
            rust_targets: aarch64-apple-darwin
            build_args: "--mac dmg zip --arm64"
          - os: macos-13
            platform: darwin
            arch: x64
            rust_targets: x86_64-apple-darwin
            build_args: "--mac dmg zip --x64"
          - os: ubuntu-latest
            platform: linux
            rust_targets: x86_64-unknown-linux-gnu
            build_args: "--linux AppImage deb"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript + Vite + Rust native
        env:
          NATIVE_BUILD_ARCH: ${{ matrix.arch }}
        run: npm run build

      - name: Build and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.build_args }} --publish always
