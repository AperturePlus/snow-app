name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v0.1.11"
        required: true
        type: string
      release_notes:
        description: |
          ## New Features

          - **Codebase Panel**: Added a dedicated codebase panel with indexed file table and 3D similarity sphere visualization, showing file relationships based on embedding similarity.
          - **AI Natural-Language File Search**: Type `@?<query>` in the chat input to search workspace files using natural language — an AI agent autonomously calls grep and filesystem tools to locate matching files, with real-time progress display.
          - **Remote Git Support (SSH)**: Git panel now fully supports `ssh://` remote repositories — discover repos, view status, diff, stage, commit, and push on remote workspaces via SSH.

          ## Improvements

          - **3D Sphere Layout Moved to Rust**: The similarity sphere force-directed layout computation has been moved from the renderer (synchronous, blocking UI) to the Rust backend (async on background thread), eliminating frame drops on large codebases.
          - **MCP External Server Compatibility**: Added legacy `initialize` handshake fallback for older MCP servers that reject the 2026-07-28 stateless protocol (e.g., deepwiki), improving connection reliability across different server implementations.
          - **Filesystem Search Enhancements**: Expanded Rust-side filesystem explorer with line-level content match support and improved search result granularity.
          - **Remote Git Polling**: Remote (SSH) repositories without local file watchers now auto-refresh git status via polling every 10 seconds.

          ## Bug Fixes

          - Removed unused timeout constants (`DEFAULT_TIMEOUT_MS`) from MCP stdio and HTTP clients (dead code cleanup).
          - Fixed `CodebaseSphereView` component to consume Rust-computed layout data instead of computing synchronously in the renderer.

        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            rust_targets: x86_64-pc-windows-msvc
            build_args: "--win nsis portable"
          - os: macos-latest
            platform: darwin
            arch: arm64
            rust_targets: aarch64-apple-darwin
            build_args: "--mac dmg zip --arm64"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            rust_targets: x86_64-apple-darwin
            build_args: "--mac dmg zip --x64"
          - os: ubuntu-latest
            platform: linux
            rust_targets: x86_64-unknown-linux-gnu
            build_args: "--linux AppImage deb"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript + Vite + Rust native
        env:
          NATIVE_BUILD_ARCH: ${{ matrix.arch }}
        run: npm run build

      - name: Build electron packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Rename arm64 update yml to avoid collision
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: |
          if [ -f release/latest-mac.yml ]; then
            mv release/latest-mac.yml release/latest-mac-arm64.yml
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Merge macOS update yml (arm64 + x64)
        run: node scripts/merge-mac-yml.cjs

      # 生成无签名更新清单 latest-mac.json（版本号 + 各架构 zip 的 SHA-256）
      - name: Generate latest-mac.json
        run: node scripts/generate-latest-json.cjs ${{ inputs.tag || github.ref_name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/latest-mac.json
