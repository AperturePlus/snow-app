# NOTE: This file must live at the repository ROOT. Cargo resolves config by
# walking up from the current working directory, and our build scripts invoke
# cargo from the project root -- a config under native/ would never be picked up.
#
# Per-platform linker strategy:
# - Windows (msvc): rust-lld (lld-link flavor) replaces the slow MSVC link.exe.
# - Linux (x86_64 gnu): rust-lld (ELF flavor), bundled with the toolchain,
#   drop-in replacement with no extra install.
# - macOS: intentionally left at the default Apple linker. LLVM lld's Mach-O
#   support (ld64.lld) is not production-ready, and Xcode 15+'s rewritten
#   linker is already fast -- swapping it would risk broken links for no gain.
# - Linux arm64: left at default for now; cross targets may not ship rust-lld.

# Windows: significantly faster linking for the large cdylib
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Linux: bundled rust-lld, no dependency on a system lld/clang
[target.x86_64-unknown-linux-gnu]
linker = "rust-lld"
