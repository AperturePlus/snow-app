[package]
name = "snow_native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-openai = { version = "0.30.1", features = ["byot"] }
chrono = "0.4.38"
dirs-next = "2.0.0"
futures = "0.3.31"
napi = { version = "3.2.4", default-features = false, features = ["napi4"] }
napi-derive = "3.2.4"
reqwest = { version = "0.12.5", features = ["blocking", "json", "gzip", "brotli", "deflate", "zstd", "charset"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.39.2", features = ["rt"] }

[build-dependencies]
napi-build = "2.2.3"
