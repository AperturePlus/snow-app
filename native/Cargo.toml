[package]
name = "snow_native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-openai = { version = "0.30.1", features = ["byot"] }
chrono = "0.4.38"
blake3 = "1"
base64 = "0.22"
dirs-next = "2.0.0"
futures = "0.3.31"
napi = { version = "3.2.4", default-features = false, features = ["napi4", "async"] }
napi-derive = "3.2.4"
reqwest = { version = "0.12.5", features = ["blocking", "json", "stream", "gzip", "brotli", "deflate", "zstd", "charset"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9"
tokio = { version = "1.39.2", features = ["io-util", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
notify = "6"
regex = "1"
similar = "2"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
calamine = "0.36"
csv = "1.4"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
napi-build = "2.2.3"
