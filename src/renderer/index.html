<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: theme-bg:; connect-src 'self' ws://localhost:* http://localhost:*;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <title>Snow App</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader"><div class="boot-spinner"></div></div>
    </div>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          background: #0a0a0a;
        }
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(128, 128, 128, 0.2);
        border-top-color: rgba(128, 128, 128, 0.8);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
